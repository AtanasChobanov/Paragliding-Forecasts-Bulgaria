[project]
name = "paragliding-forecasts-ml"
version = "0.1.0"
description = "Data ingestion, feature engineering, and ML workflows for Paragliding Forecasts Bulgaria."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "eccodes==2.47.0",
    "numpy>=2.0,<3",
    "playwright>=1.62.0",
    "pydantic>=2.12.0,<3",
    "selectolax>=0.4.11",
    "tifffile>=2025.6.11,<2027",
    "tzdata>=2025.2,<2027",
]

[project.scripts]
xccontest-collect = "paragliding_forecasts_ml.ingestion.xccontest.cli:main"
xccontest-parse = "paragliding_forecasts_ml.ingestion.xccontest.parser_cli:main"
xccontest-site-mappings = "paragliding_forecasts_ml.ingestion.xccontest.site_mapping_cli:main"
xccontest-validate = "paragliding_forecasts_ml.ingestion.xccontest.validator_cli:main"
xccontest-persist = "paragliding_forecasts_ml.ingestion.xccontest.persistence_cli:main"
gfs-collect = "paragliding_forecasts_ml.ingestion.gfs.cli:main"
gfs-parse = "paragliding_forecasts_ml.ingestion.gfs.parser_cli:main"
gfs-sample = "paragliding_forecasts_ml.ingestion.weather.spatial_cli:main"
copernicus-elevations = "paragliding_forecasts_ml.ingestion.copernicus.elevation_cli:main"
xccontest-ingest = "paragliding_forecasts_ml.ingestion.xccontest.pipeline_cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
